name: WordPress
description: Popular content management system
logo: https://cdn.simpleicons.org/wordpress
category: application
priority: 100
container_port: 80
mounts:
  - id: app
    name: Application Data
    container_path: /var/www/html
    description: Bind mount for entire WordPress installation (advanced)
    type: file
    required: false
    user: "33:33"
  - id: uploads
    name: Media Uploads
    container_path: /var/www/html/wp-content/uploads
    description: Bind mount for media uploads only
    type: file
    required: false
    user: "33:33"
  - id: plugins
    name: Plugins
    container_path: /var/www/html/wp-content/plugins
    description: Bind mount for WordPress plugins
    type: file
    required: false
    user: "33:33"
backup:
  container_paths:
    - service: wordpress
      container_path: /var/www/html/wp-content/plugins
      description: WordPress plugins
      required: false
    - service: wordpress
      container_path: /var/www/html/wp-content/themes
      description: WordPress themes
      required: false
    - service: wordpress
      container_path: /var/www/html/wp-content/uploads
      description: Media uploads
      required: true
  databases:
    - service: wordpress
      type: mysql
      host_env: WORDPRESS_DB_HOST
      user_env: WORDPRESS_DB_USER
      password_env: WORDPRESS_DB_PASSWORD
      database_env: WORDPRESS_DB_NAME
  pre_hooks:
    - service: wordpress
      command: wp maintenance-mode activate --allow-root || true
      timeout: 30
  post_hooks:
    - service: wordpress
      command: wp maintenance-mode deactivate --allow-root || true
      timeout: 30

security_profile: {
    "api_version": "flatrun.security-profile/v1",
    "baseline_version": "1.0.0",
    "version": "1.0.0",
    "runtime": "php",
    "targets": {
      "source": {
        "service": "wordpress",
        "roots": [
          "/var/www/html"
        ],
        "metadata_sources": [
          "inventory"
        ]
      }
    },
    "reviews": {
      "runtime-files": {
        "concern": "integrity",
        "target": "source",
        "runs": [
          "incremental",
          "full"
        ],
        "expectations": [
          "Inspect approved snapshots without executing application code. Indicators require runtime and policy context."
        ],
        "collect": [
          {
            "id": "runtime-files",
            "image": "",
            "command": [
              "python3",
              "/collectors/inventory.py",
              "--runtime",
              "php"
            ],
            "snapshot_paths": [
              "."
            ],
            "metadata_sources": [],
            "required": true,
            "signals": [
              {
                "id": "file-indicators",
                "kind": "json_count_gt",
                "pointer": "/items/0/indicator_count",
                "value": 0
              }
            ]
          }
        ]
      }
    },
    "schedule": {
      "incremental": "*/5 * * * *",
      "retrospective": "17 * * * *",
      "full": "0 2 * * *"
    },
    "budget": {
      "timeout_seconds": 30,
      "max_output_bytes": 65536,
      "max_files": 10000,
      "max_snapshot_bytes": 67108864,
      "model_input_bytes": 131072,
      "model_output_bytes": 32768,
      "max_file_bytes": 1048576
    },
    "access_policy": {
      "version": "1",
      "actions": {}
    }
  }
