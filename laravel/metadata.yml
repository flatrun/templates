name: Laravel
description: PHP framework for web artisans
logo: https://cdn.simpleicons.org/laravel
category: framework
priority: 80
container_port: 8000
quick_actions:
  - id: optimize
    name: Optimize
    command: php artisan optimize
    description: Clear and rebuild all caches
    icon: pi pi-bolt
  - id: migrate
    name: Run Migrations
    command: php artisan migrate --force
    description: Run database migrations
    icon: pi pi-database
  - id: cache-clear
    name: Clear Cache
    command: php artisan cache:clear
    description: Flush the application cache
    icon: pi pi-trash
  - id: config-clear
    name: Clear Config
    command: php artisan config:clear
    description: Remove the configuration cache file
    icon: pi pi-cog
mounts:
  - id: app
    name: Application
    container_path: /app
    description: Laravel application source code
    type: file
    required: false
    user: "1000:1000"
  - id: env
    name: Environment Config
    host_path: ./.env
    container_path: /app/.env
    description: Laravel environment configuration file
    type: file
    required: true
    user: "1000:1000"
  - id: storage
    name: Storage
    container_path: /app/storage
    description: Logs, cache, and file uploads
    type: file
    required: true
    user: "1000:1000"
    subdirectories:
      - app/public
      - app/private
      - framework/cache
      - framework/sessions
      - framework/testing
      - framework/views
      - logs
  - id: bootstrap-cache
    name: Bootstrap Cache
    host_path: ./bootstrap/cache
    container_path: /app/bootstrap/cache
    description: Compiled framework files
    type: file
    required: true
    user: "1000:1000"
env:
  file: .env
  example_path: /app/.env.example
  template: |
    APP_NAME=${NAME}
    APP_ENV=production
    APP_KEY=
    APP_DEBUG=false
    APP_URL=http://localhost

    DB_CONNECTION=mysql
    DB_HOST=
    DB_PORT=
    DB_DATABASE=
    DB_USERNAME=
    DB_PASSWORD=

    CACHE_DRIVER=file
    SESSION_DRIVER=file
    QUEUE_CONNECTION=sync
  secrets:
    - key: APP_KEY
      prefix: "base64:"
      encoding: base64
      bytes: 32
backup:
  container_paths:
    - service: app
      container_path: /app/storage
      description: Storage directory (logs, cache, uploads)
      required: true
    - service: app
      container_path: /app/.env
      description: Environment configuration
      required: true
  databases:
    - service: app
      type: mysql
      host_env: DB_HOST
      port_env: DB_PORT
      user_env: DB_USERNAME
      password_env: DB_PASSWORD
      database_env: DB_DATABASE
  pre_hooks:
    - service: app
      command: php artisan down --retry=60
      timeout: 30
  post_hooks:
    - service: app
      command: php artisan up
      timeout: 30

security_profile: {
    "api_version": "flatrun.security-profile/v1",
    "baseline_version": "1.0.0",
    "version": "1.0.0",
    "runtime": "php",
    "targets": {
      "source": {
        "service": "app",
        "roots": [
          "/app"
        ],
        "metadata_sources": [
          "inventory"
        ]
      }
    },
    "reviews": {
      "runtime-files": {
        "concern": "integrity",
        "target": "source",
        "runs": [
          "incremental",
          "full"
        ],
        "expectations": [
          "Inspect approved snapshots without executing application code. Indicators require runtime and policy context."
        ],
        "collect": [
          {
            "id": "runtime-files",
            "image": "",
            "command": [
              "python3",
              "/collectors/inventory.py",
              "--runtime",
              "php"
            ],
            "snapshot_paths": [
              "."
            ],
            "metadata_sources": [],
            "required": true,
            "signals": [
              {
                "id": "file-indicators",
                "kind": "json_count_gt",
                "pointer": "/items/0/indicator_count",
                "value": 0
              }
            ]
          }
        ]
      }
    },
    "schedule": {
      "incremental": "*/5 * * * *",
      "retrospective": "17 * * * *",
      "full": "0 2 * * *"
    },
    "budget": {
      "timeout_seconds": 30,
      "max_output_bytes": 65536,
      "max_files": 10000,
      "max_snapshot_bytes": 67108864,
      "model_input_bytes": 131072,
      "model_output_bytes": 32768,
      "max_file_bytes": 1048576
    },
    "access_policy": {
      "version": "1",
      "actions": {}
    }
  }
