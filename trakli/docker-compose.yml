name: ${NAME}
services:
  app:
    image: ghcr.io/trakli/webservice:latest
    container_name: ${NAME}
    command: ["sh", "-c", "php artisan migrate --force && exec frankenphp run --config /etc/caddy/Caddyfile"]
    environment: &trakli
      APP_NAME: Trakli
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: trakli
      DB_USERNAME: trakli
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - ./storage:/var/www/html/storage
    expose:
      - "80"
    networks:
      - default
      - proxy
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  worker:
    image: ghcr.io/trakli/webservice:latest
    container_name: ${NAME}-worker
    command: php artisan queue:work --tries=3 --timeout=120
    environment: *trakli
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
  mysql:
    image: mysql:8.0
    container_name: ${NAME}-mysql
    environment:
      MYSQL_DATABASE: trakli
      MYSQL_USER: trakli
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./data/mysql:/var/lib/mysql
    restart: unless-stopped

networks:
  proxy:
    external: true
