name: PHP
description: PHP with Apache web server
logo: https://cdn.simpleicons.org/php
category: runtime
priority: 30
container_port: 80
mounts:
  - id: html
    name: Web Root
    container_path: /var/www/html
    description: PHP application files
    type: file
    required: true

security_profile: {
    "api_version": "flatrun.security-profile/v1",
    "baseline_version": "1.0.0",
    "version": "1.0.0",
    "runtime": "php",
    "targets": {
      "source": {
        "service": "app",
        "roots": [
          "/var/www/html"
        ],
        "metadata_sources": [
          "inventory"
        ]
      }
    },
    "reviews": {
      "runtime-files": {
        "concern": "integrity",
        "target": "source",
        "runs": [
          "incremental",
          "full"
        ],
        "expectations": [
          "Inspect approved snapshots without executing application code. Indicators require runtime and policy context."
        ],
        "collect": [
          {
            "id": "runtime-files",
            "image": "",
            "command": [
              "python3",
              "/collectors/inventory.py",
              "--runtime",
              "php"
            ],
            "snapshot_paths": [
              "."
            ],
            "metadata_sources": [],
            "required": true,
            "signals": [
              {
                "id": "file-indicators",
                "kind": "json_count_gt",
                "pointer": "/items/0/indicator_count",
                "value": 0
              }
            ]
          }
        ]
      }
    },
    "schedule": {
      "incremental": "*/5 * * * *",
      "retrospective": "17 * * * *",
      "full": "0 2 * * *"
    },
    "budget": {
      "timeout_seconds": 30,
      "max_output_bytes": 65536,
      "max_files": 10000,
      "max_snapshot_bytes": 67108864,
      "model_input_bytes": 131072,
      "model_output_bytes": 32768,
      "max_file_bytes": 1048576
    },
    "access_policy": {
      "version": "1",
      "actions": {}
    }
  }
